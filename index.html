<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ペアトークテーマメーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Bungee&display=swap" rel="stylesheet">
<script>
  // ローカル開発時のキャッシュ事故防止：JS/CSS にタイムスタンプを差し込んで毎回リロード
  (function () {
    const t = Date.now();
    document.write(
      '<link rel="stylesheet" href="style.css?t=' + t + '">' +
      '<script src="themes.js?t=' + t + '"><\/script>' +
      '<script src="app.js?t=' + t + '"><\/script>'
    );
  })();
</script>
</head>
<body>

<!-- ===================== 設定モード ===================== -->
<div id="editorView" class="view">
  <header class="app-header">
    <h1 class="app-title mario-title">
      <span class="c1">ペ</span><span class="c2">ア</span><span class="c3">ト</span><span class="c4">ー</span><span class="c1">ク</span><span class="c2">テ</span><span class="c3">ー</span><span class="c4">マ</span><span class="c1">メ</span><span class="c2">ー</span><span class="c3">カ</span><span class="c4">ー</span>
    </h1>
  </header>

  <div class="editor-layout">
    <!-- 左：テーマ編集 -->
    <section class="panel panel-left">
      <div class="panel-head">
        <h2>トークテーマ <span id="themeCount" class="count">0</span></h2>
        <div class="panel-actions">
          <button id="btnAllOn" class="btn btn-tiny btn-mario-green">全てON</button>
          <button id="btnAllOff" class="btn btn-tiny">全てOFF</button>
          <button id="btnReset" class="btn btn-tiny btn-mario-red">初期化</button>
        </div>
      </div>
      <div id="themeList" class="theme-list"></div>
    </section>

    <!-- 右：プレビュースロット -->
    <section class="panel panel-right">
      <h2>プレビュー</h2>
      <div class="slot-stage trial-stage">
        <div class="slot-frame">
          <div id="trialSlot" class="slot-window"></div>
        </div>
        <button id="trialBtn" class="btn btn-mario-red btn-big">スタート</button>
      </div>

      <div class="publish-area">
        <button id="btnPublish" class="btn btn-mario-green btn-big">完成 → URL発行</button>
        <div id="publishResult" class="publish-result">
          <label>発行URL</label>
          <div class="url-row">
            <input id="publishedUrl" type="text" readonly placeholder="「完成 → URL発行」を押すとここに表示されます">
            <button id="btnCopy" class="btn btn-mario-blue">コピー</button>
            <button id="btnOpen" class="btn btn-mario-blue">開く</button>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- ===================== 本番（プレイ）モード ===================== -->
<div id="playView" class="view hidden">
  <header class="play-header">
    <h1 class="play-title mario-title">
      <span class="c1">ペ</span><span class="c2">ア</span><span class="c3">ト</span><span class="c4">ー</span><span class="c1">ク</span><span class="c2">テ</span><span class="c3">ー</span><span class="c4">マ</span><span class="c1">メ</span><span class="c2">ー</span><span class="c3">カ</span><span class="c4">ー</span>
    </h1>
  </header>

  <main class="play-main">
    <!-- 大スロット -->
    <div class="slot-frame play-frame">
      <div id="playSlot" class="play-window"><div class="slot-inner">スタートを<ruby>押<rt>お</rt></ruby>してね</div></div>
      <!-- 上の初期HTMLはfallback。app.js が描画する内容に置き換わる -->

    </div>

    <!-- 4ボタン横並び -->
    <div class="action-row">
      <button id="playSlotBtn" class="btn btn-mario-red btn-mega">スタート</button>
      <button id="btnTimerStop" class="btn btn-mario-blue btn-small">ストップ</button>
      <button id="btnTimerReset" class="btn btn-mario-green btn-small">リセット</button>
      <button id="btnTimerRestart" class="btn btn-mario-yellow btn-small">リスタート</button>
    </div>

    <!-- 横長タイマー -->
    <div id="timerBlock" class="timer-block" tabindex="0">
      <div id="timerRow" class="timer-row">
        <div class="time-unit">
          <button class="arrow arrow-up" data-target="min" data-delta="1" aria-label="分を1増やす">▲</button>
          <div class="time-num" id="timeMinDisplay">01</div>
          <button class="arrow arrow-down" data-target="min" data-delta="-1" aria-label="分を1減らす">▼</button>
        </div>
        <div class="time-colon">:</div>
        <div class="time-unit">
          <button class="arrow arrow-up" data-target="sec" data-delta="10" aria-label="秒を10増やす">▲</button>
          <div class="time-num" id="timeSecDisplay">00</div>
          <button class="arrow arrow-down" data-target="sec" data-delta="-10" aria-label="秒を10減らす">▼</button>
        </div>
      </div>
    </div>
  </main>

  <!-- 3,2,1 カウントダウン演出 -->
  <div id="countdownOverlay" class="countdown-overlay hidden">
    <div id="countdownText" class="countdown-text">3</div>
  </div>

  <div id="finishOverlay" class="finish-overlay hidden">
    <div class="finish-content">
      <div class="finish-mark">時間です！</div>
      <button id="finishClose" class="btn btn-mario-red btn-big">OK</button>
    </div>
  </div>
</div>

<!-- テーマ編集行のテンプレ -->
<template id="themeRowTpl">
  <div class="theme-row">
    <label class="checkbox">
      <input type="checkbox" class="theme-enable">
    </label>
    <div class="theme-num"></div>
    <div class="theme-fields">
      <input type="text" class="theme-body" placeholder="本文（例：好きな給食のメニューは？）" spellcheck="false">
      <input type="text" class="theme-ruby" placeholder="ルビ（例：好=す，給食=きゅうしょく）" spellcheck="false">
    </div>
    <button class="btn-icon theme-clear" title="クリア">×</button>
  </div>
</template>

</body>
</html>
