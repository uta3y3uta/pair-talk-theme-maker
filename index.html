<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ペアトークテーマメーカー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== 設定モード ===================== -->
<div id="editorView" class="view">
  <header class="app-header">
    <h1 class="app-title">ペアトークテーマメーカー</h1>
    <p class="app-subtitle">ペアトークのテーマを決めよう！</p>
  </header>

  <div class="editor-layout">
    <!-- 左：テーマ編集 -->
    <section class="panel panel-left">
      <div class="panel-head">
        <h2>トークテーマ <span id="themeCount" class="count">0</span></h2>
        <div class="panel-actions">
          <button id="btnAllOn" class="btn btn-tiny">全てON</button>
          <button id="btnAllOff" class="btn btn-tiny">全てOFF</button>
          <button id="btnReset" class="btn btn-tiny btn-danger">初期化</button>
        </div>
      </div>
      <div class="theme-help">
        <p>チェックを外すとスロットに登場しません。</p>
      </div>
      <div id="themeList" class="theme-list"></div>
    </section>

    <!-- 右：お試しスロット -->
    <section class="panel panel-right">
      <h2>お試し</h2>
      <div class="slot-stage trial-stage">
        <div class="slot-frame">
          <div id="trialSlot" class="slot-window"></div>
        </div>
        <button id="trialBtn" class="btn btn-primary btn-big">スタート</button>
      </div>

      <div class="publish-area">
        <button id="btnPublish" class="btn btn-accent btn-big">完成 → URL発行</button>
        <div id="publishResult" class="publish-result hidden">
          <label>発行URL</label>
          <div class="url-row">
            <input id="publishedUrl" type="text" readonly>
            <button id="btnCopy" class="btn btn-secondary">コピー</button>
            <button id="btnOpen" class="btn btn-secondary">開く</button>
          </div>
          <p class="hint">このURLを開くと，スロット＋タイマーだけのシンプル画面になります。</p>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- ===================== 本番（プレイ）モード ===================== -->
<div id="playView" class="view hidden">
  <header class="play-header">
    <h1 class="play-title">ペアトークテーマメーカー</h1>
  </header>

  <main class="play-main">
    <!-- 大スロット -->
    <div class="play-slot-wrap">
      <div class="slot-frame play-frame">
        <div id="playSlot" class="play-window">スタートを<ruby>押<rt>お</rt></ruby>してね</div>
      </div>
      <button id="playSlotBtn" class="btn btn-primary btn-mega">スタート</button>
    </div>

    <!-- タイマー（テーマのすぐ下に大きく） -->
    <div id="timerBlock" class="timer-block" tabindex="0">
      <div class="timer-label">のこり<ruby>時間<rt>じかん</rt></ruby></div>
      <div id="timerRow" class="timer-row">
        <div class="time-unit">
          <button class="arrow arrow-up" data-target="min" data-delta="1" aria-label="分を1増やす">▲</button>
          <div class="time-num" id="timeMinDisplay">01</div>
          <button class="arrow arrow-down" data-target="min" data-delta="-1" aria-label="分を1減らす">▼</button>
          <div class="time-unit-label">分</div>
        </div>
        <div class="time-colon">:</div>
        <div class="time-unit">
          <button class="arrow arrow-up" data-target="sec" data-delta="10" aria-label="秒を10増やす">▲</button>
          <div class="time-num" id="timeSecDisplay">00</div>
          <button class="arrow arrow-down" data-target="sec" data-delta="-10" aria-label="秒を10減らす">▼</button>
          <div class="time-unit-label">秒</div>
        </div>
      </div>
      <div class="timer-controls">
        <button id="btnTimerStop" class="btn btn-secondary">ストップ</button>
        <button id="btnTimerReset" class="btn">リセット</button>
      </div>
    </div>
  </main>

  <div id="finishOverlay" class="finish-overlay hidden">
    <div class="finish-content">
      <div class="finish-mark">時間です！</div>
      <button id="finishClose" class="btn btn-primary btn-big">OK</button>
    </div>
  </div>
</div>

<!-- テーマ編集行のテンプレ -->
<template id="themeRowTpl">
  <div class="theme-row">
    <label class="checkbox">
      <input type="checkbox" class="theme-enable">
    </label>
    <div class="theme-num"></div>
    <div class="theme-text" contenteditable="true" spellcheck="false"></div>
    <button class="btn-icon theme-clear" title="クリア">×</button>
  </div>
</template>

<script src="themes.js"></script>
<script src="app.js"></script>
</body>
</html>
