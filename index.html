<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ペアトークテーマメーカー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== 設定モード ===================== -->
<div id="editorView" class="view">
  <header class="app-header">
    <h1 class="app-title">ペアトークテーマメーカー</h1>
    <p class="app-subtitle">スロットでペアトークのテーマを決めよう！</p>
  </header>

  <div class="editor-layout">
    <!-- 左：テーマ編集 -->
    <section class="panel panel-left">
      <div class="panel-head">
        <h2>トークテーマ <span id="themeCount" class="count">0</span></h2>
        <div class="panel-actions">
          <button id="btnAddTheme" class="btn btn-secondary">＋ テーマを追加</button>
          <button id="btnAllOn" class="btn btn-tiny">全てON</button>
          <button id="btnAllOff" class="btn btn-tiny">全てOFF</button>
          <button id="btnReset" class="btn btn-tiny btn-danger">初期化</button>
        </div>
      </div>
      <div class="theme-help">
        <p>チェックを外すとスロットに登場しません。デフォルト250個＋オリジナル50個まで追加できます。</p>
      </div>
      <div id="themeList" class="theme-list"></div>
    </section>

    <!-- 右：お試しスロット -->
    <section class="panel panel-right">
      <h2>お試し</h2>
      <div class="trial-options">
        <label class="checkbox">
          <input type="checkbox" id="trialAllowDup" checked>
          <span>重複アリ</span>
        </label>
      </div>

      <div class="slot-stage trial-stage">
        <div class="slot-frame">
          <div id="trialSlot" class="slot-window"></div>
        </div>
        <button id="trialBtn" class="btn btn-primary btn-big">スタート</button>
        <p class="trial-note">本番ではこのスロットだけが大きく表示されます。</p>
      </div>

      <div class="publish-area">
        <button id="btnPublish" class="btn btn-primary btn-big">完成 → URL発行</button>
        <div id="publishResult" class="publish-result hidden">
          <label>発行URL</label>
          <div class="url-row">
            <input id="publishedUrl" type="text" readonly>
            <button id="btnCopy" class="btn btn-secondary">コピー</button>
            <button id="btnOpen" class="btn btn-secondary">開く</button>
          </div>
          <p class="hint">このURLを開くと，スロット＋タイマーだけのシンプル画面になります。</p>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- ===================== 本番（プレイ）モード ===================== -->
<div id="playView" class="view hidden">
  <header class="play-header">
    <h1 class="play-title">ペアトークテーマメーカー</h1>
  </header>

  <main class="play-main">
    <div class="play-slot-stage">
      <div class="slot-frame play-frame">
        <div id="playSlot" class="slot-window play-window"></div>
      </div>
      <button id="playSlotBtn" class="btn btn-primary btn-mega">スタート</button>
    </div>

    <div class="play-side">
      <div class="timer-setting">
        <label>トーク時間</label>
        <div class="time-input-row">
          <input id="timeMin" type="number" min="0" max="60" value="3">
          <span>分</span>
          <input id="timeSec" type="number" min="0" max="59" value="0">
          <span>秒</span>
        </div>
        <div class="quick-times">
          <button class="btn btn-tiny quick-time" data-sec="30">30秒</button>
          <button class="btn btn-tiny quick-time" data-sec="60">1分</button>
          <button class="btn btn-tiny quick-time" data-sec="120">2分</button>
          <button class="btn btn-tiny quick-time" data-sec="180">3分</button>
          <button class="btn btn-tiny quick-time" data-sec="300">5分</button>
        </div>
        <label class="checkbox dup-check">
          <input type="checkbox" id="playAllowDup" checked>
          <span>重複アリ</span>
        </label>
      </div>

      <div class="timer-display">
        <div class="timer-label">のこり時間</div>
        <div id="timerText" class="timer-text">03:00</div>
        <div class="timer-controls">
          <button id="btnTimerStop" class="btn btn-secondary">ストップ</button>
          <button id="btnTimerReset" class="btn btn-secondary">リセット</button>
        </div>
      </div>
    </div>
  </main>

  <div id="finishOverlay" class="finish-overlay hidden">
    <div class="finish-content">
      <div class="finish-mark">時間です！</div>
      <button id="finishClose" class="btn btn-primary btn-big">OK</button>
    </div>
  </div>
</div>

<!-- テーマ編集行のテンプレ -->
<template id="themeRowTpl">
  <div class="theme-row">
    <label class="checkbox">
      <input type="checkbox" class="theme-enable">
    </label>
    <div class="theme-num"></div>
    <div class="theme-text" contenteditable="true" spellcheck="false"></div>
    <button class="btn-icon theme-del" title="削除">×</button>
  </div>
</template>

<script src="themes.js"></script>
<script src="app.js"></script>
</body>
</html>
